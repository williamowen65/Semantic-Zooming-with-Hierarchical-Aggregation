<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic Zooming with Hierarchical Aggregation</title>
  <link rel="stylesheet" href="styles.css?v=20260812-1750" />
  <link rel="stylesheet" href="theme-toolbar-fix.css?v=20260812-1750" />
  <link rel="stylesheet" href="layer-context.css?v=20260812-1750" />
  <link rel="stylesheet" href="leaf-end-state.css?v=20260812-1750" />
</head>
<body>
  <header class="toolbar"><div class="title-block"><h1>Atlas hierarchy prototype</h1><p>Weighted tiled clusters · broad roots only for this data pass</p></div><nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumb"></nav><button id="reset" class="reset-button" type="button">All roots</button></header>
  <main id="viz" aria-label="Interactive weighted hierarchy visualization"></main>
  <aside id="theme-control" class="theme-control" aria-label="Visualization tools"><button id="tools-trigger" class="tools-trigger" type="button" aria-expanded="false" aria-controls="tools-panel" aria-label="Open visualization tools"><span class="tools-icon" aria-hidden="true">⚙</span></button><div id="tools-panel" class="tools-panel" role="dialog" aria-modal="false" aria-label="Visualization tools" hidden><div class="tools-panel-heading"><strong>Display</strong><button id="tools-close" class="tools-close" type="button" aria-label="Close visualization tools">×</button></div><div class="display-settings-row"><div class="theme-setting"><span class="theme-setting-label">Theme</span><button class="theme-trigger" type="button" aria-label="Cycle visualization theme"><span id="current-theme-name" class="current-theme-name" aria-live="polite">Calm & Earthy</span><span class="theme-next" aria-hidden="true">›</span></button></div><div class="legend-setting"><span class="theme-setting-label">Legend</span><button id="legend-toggle" class="legend-toggle" type="button" aria-pressed="true" aria-controls="visual-key"><span class="legend-toggle-icon" aria-hidden="true">☷</span><span id="legend-toggle-label">On</span></button></div></div><div class="hierarchy-zoom-setting"><span class="theme-setting-label">Hierarchy zoom</span><div class="hierarchy-zoom-control"><button id="hierarchy-zoom-out" class="hierarchy-zoom-button" type="button" aria-label="Zoom hierarchy out">−</button><output id="hierarchy-zoom-readout" class="hierarchy-zoom-readout" aria-live="polite">Standard · 100%</output><button id="hierarchy-zoom-in" class="hierarchy-zoom-button" type="button" aria-label="Zoom hierarchy in">+</button></div></div></div></aside>
  <div id="visual-key" class="key" aria-label="Visual encoding key"><span><i class="key-cell selected"></i> selected</span><span><i class="key-cell faded"></i> sibling context</span><span><i class="key-area"></i> area = aggregate importance</span><span>drag / pinch = pan and zoom a layer</span></div>
  <div id="status" class="status" aria-live="polite"></div>
  <script src="https://d3js.org/d3.v6.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script src="app.js?v=20260812-1750"></script><script src="environment-expansion.js?v=20260812-1750"></script><script src="descriptions.js?v=20260812-1750"></script><script src="enhancements.js?v=20260812-1750"></script><script src="camera-spacing-fix.js?v=20260812-1750"></script><script src="semantic-icons.js?v=20260812-1750"></script><script src="hierarchy-links.js?v=20260812-1750"></script><script src="theme-picker.js?v=20260812-1750"></script><script src="layer-context.js?v=20260812-1750"></script><script src="leaf-end-state.js?v=20260812-1750"></script><script src="hierarchy-overview.js?v=20260812-1750"></script>
</body>
</html>
