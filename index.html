<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic Zooming with Hierarchical Aggregation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="title-block">
      <h1>Atlas hierarchy prototype</h1>
      <p>Weighted tiled clusters · click to expand · wheel/swipe to travel the vertical path</p>
    </div>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumb"></nav>
    <button id="reset" class="reset-button" type="button">All roots</button>
  </header>
  <main id="viz" aria-label="Interactive weighted hierarchy visualization"></main>
  <div class="key" aria-label="Visual encoding key">
    <span><i class="key-cell selected"></i> selected</span>
    <span><i class="key-cell faded"></i> sibling context</span>
    <span><i class="key-area"></i> area = aggregate importance</span>
    <span>↕ wheel / swipe = travel path</span>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script src="app.js"></script>
  <script>
    const mediaNode = nodeById.get("media");
    if (mediaNode && !nodeById.has("digital-platforms")) {
      const deepLevels = [
        ["digital-platforms", "Digital Platforms", 610, 4.5, [["search-platforms", "Search Platforms"], ["video-platforms", "Video Platforms"]]],
        ["social-networks", "Social Networks", 570, 4.4, [["private-messaging", "Private Messaging"], ["online-communities", "Online Communities"]]],
        ["recommendation-systems", "Recommendation Systems", 530, 4.6, [["content-moderation", "Content Moderation"], ["feed-controls", "Feed Controls"]]],
        ["ranking-signals", "Ranking Signals", 500, 4.5, [["relevance-signals", "Relevance Signals"], ["freshness-signals", "Freshness Signals"]]],
        ["engagement-optimization", "Engagement Optimization", 470, 4.3, [["session-length", "Session Length"], ["return-frequency", "Return Frequency"]]],
        ["content-incentives", "Content Incentives", 445, 4.4, [["monetization", "Monetization"], ["virality-pressure", "Virality Pressure"]]],
        ["creator-behavior", "Creator Behavior", 420, 4.2, [["creator-economics", "Creator Economics"], ["publishing-frequency", "Publishing Frequency"]]],
        ["attention-dynamics", "Attention Dynamics", 395, 4.5, [["attention-fragmentation", "Attention Fragmentation"], ["notification-pressure", "Notification Pressure"]]],
        ["information-exposure", "Information Exposure", 370, 4.5, [["source-diversity", "Source Diversity"], ["repeat-exposure", "Repeat Exposure"]]],
        ["belief-formation", "Belief Formation", 345, 4.4, [["trust-signals", "Trust Signals"], ["social-proof", "Social Proof"]]],
        ["community-norms", "Community Norms", 320, 4.3, [["peer-effects", "Peer Effects"], ["group-identity", "Group Identity"]]],
        ["civic-response", "Civic Response", 295, 4.5, [["local-organizing", "Local Organizing"], ["public-comment", "Public Comment"]]],
        ["institutional-response", "Institutional Response", 270, 4.2, [["public-consultation", "Public Consultation"], ["agency-coordination", "Agency Coordination"]]],
        ["policy-feedback", "Policy Feedback", 245, 4.4, [["implementation", "Implementation"], ["evaluation", "Evaluation"], ["revision", "Revision"]]]
      ];
      let child = null;
      for (let i = deepLevels.length - 1; i >= 0; i -= 1) {
        const [id, name, votes, rating, siblingSpecs] = deepLevels[i];
        const siblings = siblingSpecs.map(([siblingId, siblingName], siblingIndex) => ({ id: siblingId, name: siblingName, votes: Math.max(120, votes - 120 - siblingIndex * 35), rating: Math.max(3.8, rating - 0.2 + siblingIndex * 0.1) }));
        child = { id, name, votes, rating, children: child ? [child, ...siblings] : siblings };
      }
      mediaNode.children = [...(mediaNode.children || []), child];
      annotate(mediaNode, parentById.get(mediaNode.id), rootById.get(mediaNode.id));
    }

    const extraRoots = [
      ["housing", "Housing", "#b87972", 5200, 4.5, ["Supply", "Affordability", "Stability"]],
      ["food-systems", "Food Systems", "#a7a45a", 3300, 4.2, ["Food Access", "Agriculture", "Food Waste"]],
      ["justice", "Justice", "#9d7f91", 4100, 4.3, ["Courts", "Legal Access", "Corrections"]],
      ["public-safety", "Public Safety", "#7f8ca8", 3700, 4.1, ["Emergency Response", "Prevention", "Community Safety"]],
      ["science", "Science", "#6f9da0", 3000, 4.5, ["Research", "Science Literacy", "Research Funding"]],
      ["culture", "Culture", "#b488a8", 2600, 4.2, ["Arts", "Heritage", "Civic Life"]]
    ];
    extraRoots.forEach(([id, name, color, votes, rating, childNames]) => {
      if (nodeById.has(id)) return;
      const root = { id, name, color, votes, rating, children: childNames.map((childName, index) => ({ id: `${id}-${childName.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`, name: childName, votes: Math.round(votes * (0.32 - index * 0.045)), rating: Math.max(3.9, rating - 0.1 + index * 0.05) })) };
      forestData.push(root); annotate(root);
    });

    const sampleBranches = {
      infrastructure: [
        { id:"transit-capacity", name:"Transit Capacity", votes:1420, rating:4.2, children:[{id:"bus-frequency",name:"Bus Frequency",votes:610,rating:4.3},{id:"rail-bottlenecks",name:"Rail Bottlenecks",votes:520,rating:4.0}] },
        { id:"grid-modernization", name:"Grid Modernization", votes:1180, rating:4.5, children:[{id:"microgrids",name:"Community Microgrids",votes:470,rating:4.6}] }
      ],
      education: [
        { id:"teacher-retention",name:"Teacher Retention",votes:1240,rating:4.4,children:[{id:"teacher-pay",name:"Teacher Pay",votes:620,rating:4.5},{id:"classroom-support",name:"Classroom Support",votes:510,rating:4.3}] },
        { id:"adult-learning",name:"Adult Learning",votes:760,rating:4.1 }
      ],
      healthcare: [
        { id:"primary-care",name:"Primary Care Capacity",votes:1380,rating:4.6,children:[{id:"clinic-access",name:"Clinic Access",votes:650,rating:4.5},{id:"care-navigation",name:"Care Navigation",votes:490,rating:4.4,children:[{id:"patient-guides",name:"Patient Guides",votes:230,rating:4.6}]}] },
        { id:"rural-care",name:"Rural Care Gaps",votes:840,rating:4.3 }
      ],
      economy: [
        { id:"wage-pressure",name:"Wage Pressure",votes:1120,rating:4.0 },
        { id:"small-business-capital",name:"Small Business Capital",votes:910,rating:4.3,children:[{id:"community-lending",name:"Community Lending",votes:390,rating:4.5}] }
      ],
      environment: [
        { id:"watershed-health",name:"Watershed Health",votes:980,rating:4.5,children:[{id:"river-restoration",name:"River Restoration",votes:430,rating:4.6},{id:"runoff-control",name:"Runoff Control",votes:360,rating:4.3}] },
        { id:"habitat-connectivity",name:"Habitat Connectivity",votes:720,rating:4.4 }
      ],
      governance: [
        { id:"service-delivery",name:"Public Service Delivery",votes:880,rating:4.2,children:[{id:"digital-services",name:"Digital Public Services",votes:410,rating:4.4}] },
        { id:"procurement-risk",name:"Procurement Risk",votes:650,rating:3.9 }
      ],
      "social-equity": [
        { id:"language-equity",name:"Language Equity",votes:790,rating:4.5,children:[{id:"translation-access",name:"Translation Access",votes:350,rating:4.6}] },
        { id:"disability-access",name:"Disability Access",votes:860,rating:4.7 }
      ],
      energy: [
        { id:"grid-reliability",name:"Grid Reliability",votes:1320,rating:4.4,children:[{id:"storage-capacity",name:"Storage Capacity",votes:590,rating:4.5},{id:"peak-demand",name:"Peak Demand",votes:470,rating:4.1}] },
        { id:"home-efficiency",name:"Home Efficiency",votes:980,rating:4.6,children:[{id:"weatherization",name:"Weatherization",votes:440,rating:4.7}] }
      ],
      technology: [
        { id:"algorithmic-accountability",name:"Algorithmic Accountability",votes:1040,rating:4.5,children:[{id:"model-audits",name:"Model Audits",votes:480,rating:4.6},{id:"appeal-process",name:"Appeal Process",votes:330,rating:4.4}] },
        { id:"digital-fraud",name:"Digital Fraud",votes:890,rating:4.2 }
      ],
      housing: [
        { id:"zoning-capacity",name:"Zoning Capacity",votes:1060,rating:4.2,children:[{id:"infill-housing",name:"Infill Housing",votes:460,rating:4.4}] },
        { id:"tenant-stability",name:"Tenant Stability",votes:920,rating:4.5 }
      ],
      "food-systems": [
        { id:"local-supply-chains",name:"Local Supply Chains",votes:740,rating:4.4,children:[{id:"regional-hubs",name:"Regional Food Hubs",votes:310,rating:4.5}] }
      ],
      justice: [
        { id:"case-backlog",name:"Case Backlog",votes:930,rating:4.1 },
        { id:"legal-aid-capacity",name:"Legal Aid Capacity",votes:810,rating:4.6,children:[{id:"pro-bono-network",name:"Pro Bono Network",votes:320,rating:4.5}] }
      ],
      "public-safety": [
        { id:"response-times",name:"Response Times",votes:850,rating:4.1 },
        { id:"violence-prevention",name:"Violence Prevention",votes:790,rating:4.5,children:[{id:"street-outreach",name:"Street Outreach",votes:350,rating:4.6}] }
      ],
      science: [
        { id:"open-research",name:"Open Research",votes:690,rating:4.6,children:[{id:"open-data",name:"Open Data",votes:310,rating:4.7},{id:"replication",name:"Replication",votes:270,rating:4.5}] }
      ],
      culture: [
        { id:"creative-space",name:"Creative Space",votes:610,rating:4.3,children:[{id:"shared-studios",name:"Shared Studios",votes:250,rating:4.4}] }
      ]
    };
    Object.entries(sampleBranches).forEach(([parentId, additions]) => {
      const parent = nodeById.get(parentId);
      if (parent) parent.children = [...(parent.children || []), ...additions];
    });
    forestData.forEach(root => annotate(root));

    const solutionIds = new Set([
      "adaptation", "resilience", "policy", "public-awareness", "finance", "border-policy", "refugee-support", "legal-pathways", "integration", "coastal", "water", "outreach", "media", "community", "behavior", "citizen-science", "traditional-media", "storytelling", "misinformation", "prevention", "jobs", "trade", "conservation", "institutions", "elections", "transparency", "rights", "opportunity", "inclusion", "content-moderation", "feed-controls", "source-diversity", "trust-signals", "civic-response", "local-organizing", "public-comment", "institutional-response", "public-consultation", "agency-coordination", "policy-feedback", "implementation", "evaluation", "revision", "housing-supply", "housing-stability", "food-systems-food-access", "food-systems-agriculture", "justice-legal-access", "public-safety-emergency-response", "public-safety-prevention", "public-safety-community-safety", "science-research", "science-science-literacy", "science-research-funding", "culture-arts", "culture-heritage", "culture-civic-life",
      "grid-modernization","microgrids","teacher-retention","teacher-pay","classroom-support","adult-learning","primary-care","clinic-access","care-navigation","patient-guides","small-business-capital","community-lending","river-restoration","runoff-control","habitat-connectivity","service-delivery","digital-services","language-equity","translation-access","disability-access","storage-capacity","home-efficiency","weatherization","algorithmic-accountability","model-audits","appeal-process","infill-housing","tenant-stability","local-supply-chains","regional-hubs","legal-aid-capacity","pro-bono-network","violence-prevention","street-outreach","open-research","open-data","replication","creative-space","shared-studios"
    ]);

    const semanticNames = new Map([
      ["infrastructure", "Infrastructure Gaps"], ["education", "Education Access"], ["healthcare", "Healthcare Access"], ["economy", "Economic Instability"], ["environment", "Environmental Degradation"], ["governance", "Governance Challenges"], ["social-equity", "Social Inequity"], ["technology", "Technology Risks"], ["energy", "Energy Transition Challenges"], ["housing", "Housing Affordability"], ["food-systems", "Food Insecurity"], ["justice", "Justice Access"], ["public-safety", "Public Safety Risks"], ["science", "Science Trust"], ["culture", "Cultural Access"], ["transport", "Transportation Gaps"], ["utilities", "Utility Reliability"], ["housing-infra", "Housing Infrastructure Shortage"], ["biodiversity", "Biodiversity Loss"], ["social-media", "Social Media Harms"], ["digital-platforms", "Digital Platform Effects"]
    ]);
    function applySemanticType(node) { node.kind = solutionIds.has(node.id) ? "solution" : "issue"; if (semanticNames.has(node.id)) node.name = semanticNames.get(node.id); (node.children || []).forEach(applySemanticType); }
    forestData.forEach(applySemanticType);
    const ISSUE_COLOR = "#71879a";
    const SOLUTION_COLOR = "#5f9864";
    rootColor = function(node) { return node.kind === "solution" ? SOLUTION_COLOR : ISSUE_COLOR; };
    const visualKey = document.querySelector(".key");
    if (visualKey && !visualKey.querySelector(".issue-kind-key")) {
      const issueKey = document.createElement("span"); issueKey.className = "issue-kind-key"; issueKey.innerHTML = `<i class="key-cell" style="background:${ISSUE_COLOR}"></i> issue`;
      const solutionKey = document.createElement("span"); solutionKey.className = "solution-kind-key"; solutionKey.innerHTML = `<i class="key-cell" style="background:${SOLUTION_COLOR}"></i> solution`;
      visualKey.prepend(solutionKey); visualKey.prepend(issueKey);
    }

    layoutCluster = function(items, w, h) {
      const proxies = items.map(item => ({ id: item.id, item, weight: Math.max(1, aggregateScore(item)) }));
      const root = d3.hierarchy({ children: proxies }).sum(d => d.weight || 0);
      const polygon = outerPolygon(w, h);
      const stableKey = items.map(item => item.id).join("-");
      const seed = Array.from(stableKey).reduce((a, c) => ((a * 31 + c.charCodeAt(0)) >>> 0), 2166136261) / 4294967296;
      d3.voronoiTreemap().clip(polygon).prng(d3.randomLcg(seed || 0.42))(root);
      return { root, polygon };
    };
    function edgeKeyPoint(point) { return `${point[0].toFixed(3)},${point[1].toFixed(3)}`; }
    function curvedEdgeControls(a, b) {
      const keyA = edgeKeyPoint(a), keyB = edgeKeyPoint(b), forward = keyA <= keyB, p0 = forward ? a : b, p1 = forward ? b : a;
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1], length = Math.hypot(dx, dy) || 1, nx = -dy / length, ny = dx / length;
      const hashText = `${edgeKeyPoint(p0)}|${edgeKeyPoint(p1)}`; let hash = 2166136261;
      for (const ch of hashText) hash = Math.imul(hash ^ ch.charCodeAt(0), 16777619) >>> 0;
      const sign = (hash & 1) ? 1 : -1, variation = 0.72 + ((hash >>> 1) % 29) / 100, amplitude = Math.min(10, Math.max(2.5, length * 0.075)) * variation * sign;
      const c1 = [p0[0] + dx * 0.33 + nx * amplitude, p0[1] + dy * 0.33 + ny * amplitude], c2 = [p0[0] + dx * 0.67 - nx * amplitude * 0.72, p0[1] + dy * 0.67 - ny * amplitude * 0.72];
      return forward ? [c1, c2] : [c2, c1];
    }
    polygonPath = function(poly) {
      if (!poly || poly.length < 2) return "";
      let d = `M${poly[0][0]},${poly[0][1]}`;
      for (let i = 0; i < poly.length; i += 1) { const a = poly[i], b = poly[(i + 1) % poly.length], [c1, c2] = curvedEdgeControls(a, b); d += `C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${b[0]},${b[1]}`; }
      return `${d}Z`;
    };

    const baseRenderBreadcrumbs = renderBreadcrumbs;
    renderBreadcrumbs = function() { baseRenderBreadcrumbs(); requestAnimationFrame(() => { breadcrumbHost.scrollLeft = Math.max(0, breadcrumbHost.scrollWidth - breadcrumbHost.clientWidth); }); };
    focusNode = function(id) {
      const node = nodeById.get(id); if (!node) return;
      if (window.stopHierarchyMomentum) window.stopHierarchyMomentum();
      focusPath = pathForNode(id); render();
      const targetDepth = node.children?.length ? focusPath.length : focusPath.length - 1;
      requestAnimationFrame(() => scrollToDepth(targetDepth, true));
      statusHost.textContent = node.children?.length ? `${node.name} selected. Scrolled to its ${node.children.length} child items. Scroll upward to revisit ancestors.` : `${node.name} selected. This is a leaf node in the prototype. Scroll upward to revisit ancestors.`;
    };

    (() => {
      let momentumFrame = 0, velocity = 0, lastTouchY = null, lastTouchTime = 0, touchOriginY = null, wheelTimer = 0;
      const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      function stopMomentum() { if (momentumFrame) cancelAnimationFrame(momentumFrame); momentumFrame = 0; velocity = 0; clearTimeout(wheelTimer); }
      window.stopHierarchyMomentum = stopMomentum;
      function startMomentum() {
        if (reducedMotion() || Math.abs(velocity) < 0.35 || momentumFrame) return;
        const tick = () => { const before = cameraY; cameraY += velocity; applyCamera(false); const hitBoundary = Math.abs(cameraY - before) < 0.01 && Math.abs(velocity) > 0.35; velocity *= 0.92; if (hitBoundary || Math.abs(velocity) < 0.35) { momentumFrame = 0; velocity = 0; return; } momentumFrame = requestAnimationFrame(tick); };
        momentumFrame = requestAnimationFrame(tick);
      }
      host.addEventListener("wheel", event => {
        if (!focusPath.length || worldHeight <= height) return; event.preventDefault(); event.stopImmediatePropagation(); if (momentumFrame) cancelAnimationFrame(momentumFrame); momentumFrame = 0;
        const movement = -event.deltaY * 0.78; cameraY += movement; applyCamera(false); velocity = Math.max(-42, Math.min(42, movement * 0.72)); clearTimeout(wheelTimer); wheelTimer = setTimeout(startMomentum, 52);
      }, { passive: false, capture: true });
      host.addEventListener("touchstart", event => {
        if (!focusPath.length || event.touches.length !== 1) return; event.stopImmediatePropagation(); stopMomentum(); const touch = event.touches[0]; lastTouchY = touch.clientY; touchOriginY = touch.clientY; lastTouchTime = performance.now(); touchMoved = false;
      }, { passive: true, capture: true });
      host.addEventListener("touchmove", event => {
        if (lastTouchY == null || event.touches.length !== 1 || !focusPath.length) return; event.preventDefault(); event.stopImmediatePropagation();
        const now = performance.now(), y = event.touches[0].clientY, dy = y - lastTouchY, dt = Math.max(8, now - lastTouchTime); if (Math.abs(y - touchOriginY) > 6) touchMoved = true; cameraY += dy; applyCamera(false); const instantaneous = dy * (16.667 / dt); velocity = velocity * 0.55 + instantaneous * 0.45; velocity = Math.max(-48, Math.min(48, velocity)); lastTouchY = y; lastTouchTime = now;
      }, { passive: false, capture: true });
      host.addEventListener("touchend", event => { if (lastTouchY == null) return; event.stopImmediatePropagation(); lastTouchY = null; lastTouchTime = 0; touchOriginY = null; startMomentum(); setTimeout(() => { touchMoved = false; }, 80); }, { passive: true, capture: true });
      host.addEventListener("touchcancel", () => { lastTouchY = null; lastTouchTime = 0; touchOriginY = null; stopMomentum(); touchMoved = false; }, { passive: true, capture: true });
    })();
    render();
  </script>
  <script src="public-data.js"></script>
  <script src="semantic-icons.js"></script>
</body>
</html>
