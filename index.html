<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Atlas hierarchy prototype</h1>
      <p>Generic nodes · flexible requested response types</p>
    </div>
    <button id="reset" type="button">All roots</button>
  </header>

  <nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumb"></nav>
  <div id="depth-indicator" class="depth-indicator" aria-live="polite">Depth 0</div>
  <main id="app" class="app-shell" aria-live="polite"></main>

  <aside id="theme-control" class="theme-control" aria-label="Visualization tools">
    <button id="tools-trigger" class="tools-trigger" type="button" aria-expanded="false" aria-controls="tools-panel" aria-label="Open visualization tools"><span aria-hidden="true">⚙</span></button>
    <div id="tools-panel" class="tools-panel" hidden>
      <div class="tools-panel-heading"><strong>Theme</strong><button id="tools-close" type="button" aria-label="Close visualization tools">×</button></div>
      <div id="theme-options" class="theme-options" role="group" aria-label="Visualization theme"></div>
    </div>
  </aside>

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script src="data.js"></script>
  <script src="diagram.js"></script>
  <script src="app.js"></script>
</body>
</html>
