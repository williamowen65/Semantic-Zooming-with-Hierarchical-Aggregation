<!doctype html>

  <title>Semantic Zooming with Hierarchical Aggregation</title>
  <style>
    /* Keep the app completely out of view while all render/setup passes run.
       Layout still happens normally, so the final frame can appear atomically. */
    html { background:#f7f7f4; }
    html.atlas-booting body { visibility:hidden !important; }
  </style>

</head>
<body>
  <script>
    (() => {
      const validThemes = new Set(["calm-earthy","clean-modern","bold-contrast","minimal-neutral","vibrant-distinct","soft-refined"]);
      let theme = "calm-earthy";
      let verbosity = "high";
      try {
        const saved = localStorage.getItem("atlas-theme");
        if (validThemes.has(saved)) theme = saved;
        const savedVerbosity = localStorage.getItem("atlas-verbosity");
        if (savedVerbosity === "low" || savedVerbosity === "high") verbosity = savedVerbosity;
      } catch (_) {}
      document.body.dataset.theme = theme;
      document.body.dataset.verbosity = verbosity;
      document.body.classList.add(`theme-${theme}`);
      window.__atlasInitialTheme = theme;
      window.__atlasInitialVerbosity = verbosity;
    })();
  </script>
  <header class="toolbar"><div class="title-block"><h1>Atlas hierarchy prototype</h1><p>Weighted tiled clusters · mixed scopes from personal to societal</p></div><nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumb"></nav><button id="reset" class="reset-button" type="button">All roots</button></header>
  <main id="viz" aria-label="Interactive weighted hierarchy visualization"></main>
  <aside id="theme-control" class="theme-control" aria-label="Visualization tools"><button id="tools-trigger" class="tools-trigger" type="button" aria-expanded="false" aria-controls="tools-panel" aria-label="Open visualization tools"><span class="tools-icon" aria-hidden="true">⚙</span></button><div id="tools-panel" class="tools-panel" role="dialog" aria-modal="false" aria-label="Visualization tools" hidden><div class="tools-panel-heading"><strong>Display</strong><button id="tools-close" class="tools-close" type="button" aria-label="Close visualization tools">×</button></div><div class="display-settings-row"><div class="theme-setting"><span class="theme-setting-label">Theme</span><button class="theme-trigger" type="button" aria-label="Cycle visualization theme"><span id="current-theme-name" class="current-theme-name" aria-live="polite">Calm & Earthy</span><span class="theme-next" aria-hidden="true">›</span></button></div><div class="legend-setting"><span class="theme-setting-label">Legend</span><button id="legend-toggle" class="legend-toggle" type="button" aria-pressed="true" aria-controls="visual-key"><span class="legend-toggle-icon" aria-hidden="true">☷</span><span id="legend-toggle-label">On</span></button></div></div><div class="verbosity-setting"><span class="theme-setting-label">Verbosity</span><button id="verbosity-toggle" class="verbosity-toggle" type="button" aria-pressed="true"><span>Node labels</span><span id="verbosity-toggle-label" class="verbosity-choice">High</span></button></div><div class="hierarchy-zoom-setting"><span class="theme-setting-label">Hierarchy zoom</span><div class="hierarchy-zoom-control"><button id="hierarchy-zoom-out" class="hierarchy-zoom-button" type="button" aria-label="Zoom hierarchy out">−</button><output id="hierarchy-zoom-readout" class="hierarchy-zoom-readout" aria-live="polite">Standard · 100%</output><button id="hierarchy-zoom-in" class="hierarchy-zoom-button" type="button" aria-label="Zoom hierarchy in">+</button></div></div><div class="stress-test-setting"><label class="theme-setting-label" for="dense-layer-size">Dense layer test</label><select id="dense-layer-size" class="stress-test-select" aria-label="Dense layer stress-test item count"><option value="0">Off</option><option value="50">50 items</option><option value="100">100 items</option><option value="250">250 items</option><option value="500">500 items</option><option value="1000">1000 items</option></select></div></div></aside>
  <script>
    (() => {
      const control = document.querySelector("#theme-control");
      const readout = document.querySelector("#current-theme-name");
      const verbosityReadout = document.querySelector("#verbosity-toggle-label");
      const verbosityToggle = document.querySelector("#verbosity-toggle");
      const names = {
        "calm-earthy":"Calm & Earthy",
        "clean-modern":"Clean & Modern",
        "bold-contrast":"Bold & High Contrast",
        "minimal-neutral":"Minimal & Neutral",
        "vibrant-distinct":"Vibrant & Distinct",
        "soft-refined":"Soft & Refined"
      };
      if (readout && window.__atlasInitialTheme) readout.textContent = names[window.__atlasInitialTheme] || "Calm & Earthy";
      if (verbosityReadout && window.__atlasInitialVerbosity) verbosityReadout.textContent = window.__atlasInitialVerbosity === "low" ? "Low" : "High";
      if (verbosityToggle && window.__atlasInitialVerbosity) verbosityToggle.setAttribute("aria-pressed", String(window.__atlasInitialVerbosity === "high"));
      if (!control) return;
      try {
        const stored = JSON.parse(localStorage.getItem("atlas-tools-position") || "null");
        if (stored && (stored.side === "left" || stored.side === "right") && Number.isFinite(stored.top)) {
          control.dataset.side = stored.side;
          control.style.top = `${stored.top}px`;
          control.style.bottom = "auto";
        }
      } catch (_) {}
    })();
  </script>
  <div id="visual-key" class="key" aria-label="Visual encoding key"><span><i class="key-cell selected"></i> selected</span><span><i class="key-cell faded"></i> sibling context</span><span><i class="key-area"></i> area = aggregate importance</span><span>drag / pinch = pan and zoom a layer</span></div>

  <script src="https://d3js.org/d3.v6.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>

  <script>
    /* This is deliberately last. Do not reveal an intermediate frame: wait until
       the visualization exists and DOM/attribute changes have gone quiet, then
       wait for fonts and two paint frames before revealing the finished UI. */
    (() => {
      const root = document.documentElement;
      let lastChange = performance.now();
      let revealed = false;

      const observer = new MutationObserver(() => { lastChange = performance.now(); });
      observer.observe(document.body, { subtree:true, childList:true, attributes:true, characterData:true });

      function renderLooksComplete() {
        return !!(
          document.querySelector("#viz svg") &&
          document.querySelector("#viz .cell") &&
          document.querySelector("#breadcrumbs button") &&
          document.querySelector("#depth-indicator") &&
          document.body.dataset.theme &&
          document.body.dataset.verbosity
        );
      }

      function reveal() {
        if (revealed) return;
        revealed = true;
        observer.disconnect();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          root.classList.remove("atlas-booting");
        }));
      }

      async function revealAfterFonts() {
        try { if (document.fonts?.ready) await document.fonts.ready; } catch (_) {}
        reveal();
      }

      function poll() {
        const quietFor = performance.now() - lastChange;
        if (renderLooksComplete() && quietFor >= 140) {
          revealAfterFonts();
          return;
        }
        requestAnimationFrame(poll);
      }

      requestAnimationFrame(poll);
      // Fail-safe: a nonessential observer/update must never leave the app hidden.
      setTimeout(revealAfterFonts, 3000);
    })();
  </script>
</body>
</html>
