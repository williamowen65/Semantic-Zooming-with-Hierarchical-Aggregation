<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas hierarchy prototype</title>
  <link rel="stylesheet" href="styles.css?v=20260813-0713" />
  <link rel="stylesheet" href="theme-toolbar-fix.css?v=20260813-0713" />
  <link rel="stylesheet" href="layer-context.css?v=20260813-0713" />
  <link rel="stylesheet" href="leaf-end-state.css?v=20260813-1022" />
  <link rel="stylesheet" href="node-text-cleanup.css?v=20260813-0713" />
  <link rel="stylesheet" href="card-content-sizing.css?v=20260813-0713" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Atlas hierarchy prototype</h1>
      <p>Weighted tiled clusters · intentional public inquiries</p>
    </div>
    <div id="depth-indicator" class="depth-indicator">Depth 1</div>
  </header>

  <nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumbs"></nav>
  <main id="viz" aria-label="Atlas hierarchy visualization"></main>

  <button id="tools-toggle" class="tools-toggle" type="button" aria-label="Open display controls">⚙</button>
  <aside id="tools-panel" class="tools-panel" hidden>
    <button id="reset" type="button">Reset view</button>
    <div class="tool-row"><span>Theme</span><strong id="current-theme-name">Calm &amp; Earthy</strong></div>
    <div class="tool-row"><span>Detail</span><strong id="verbosity-toggle-label">High</strong></div>
    <button id="verbosity-toggle" type="button" aria-pressed="true">Toggle detail</button>
  </aside>

  <script>
    (() => {
      const control = document.querySelector("#tools-toggle");
      const readout = document.querySelector("#current-theme-name");
      const verbosityReadout = document.querySelector("#verbosity-toggle-label");
      const verbosityToggle = document.querySelector("#verbosity-toggle");
      const names = {"calm-earthy":"Calm & Earthy","clean-modern":"Clean & Modern","bold-contrast":"Bold & High Contrast","minimal-neutral":"Minimal & Neutral","vibrant-distinct":"Vibrant & Distinct","soft-refined":"Soft & Refined"};
      if (readout && window.__atlasInitialTheme) readout.textContent = names[window.__atlasInitialTheme] || "Calm & Earthy";
      if (verbosityReadout && window.__atlasInitialVerbosity) verbosityReadout.textContent = window.__atlasInitialVerbosity === "low" ? "Low" : "High";
      if (verbosityToggle && window.__atlasInitialVerbosity) verbosityToggle.setAttribute("aria-pressed", String(window.__atlasInitialVerbosity === "high"));
      if (!control) return;
      try {
        const stored = JSON.parse(localStorage.getItem("atlas-tools-position") || "null");
        if (stored && (stored.side === "left" || stored.side === "right") && Number.isFinite(stored.top)) {
          control.dataset.side = stored.side;
          control.style.top = `${stored.top}px`;
          control.style.bottom = "auto";
        }
      } catch (_) {}
    })();
  </script>

  <div id="visual-key" class="key" aria-label="Visual encoding key"><span><i class="key-cell selected"></i> selected</span><span><i class="key-cell faded"></i> sibling context</span><span><i class="key-area"></i> area = aggregate importance</span><span>drag / pinch = pan and zoom a layer</span></div>
  <div id="status" class="status" aria-live="polite"></div>

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script src="app.js?v=20260813-0713"></script>
  <script src="intentional-forest-data.js?v=20260813-1947"></script>
  <script src="node-labels-no-icons.js?v=20260813-0713"></script>
  <script src="descriptions.js?v=20260813-0713"></script>
  <script src="enhancements.js?v=20260813-0713"></script>
  <script src="camera-spacing-fix.js?v=20260813-0713"></script>
  <script src="semantic-icons.js?v=20260813-0713"></script>
  <script src="hierarchy-links.js?v=20260813-0713"></script>
  <script src="theme-picker.js?v=20260813-0713"></script>
  <script src="layer-context.js?v=20260813-0806"></script>
  <script src="scroll-to-card.js?v=20260813-0713"></script>
  <script src="leaf-end-state.js?v=20260813-1022"></script>
  <script src="hierarchy-overview.js?v=20260813-0854"></script>
  <script src="overview-gap-spacing.js?v=20260813-0811"></script>
  <script src="url-state.js?v=20260813-0713"></script>
  <script src="dense-layer-test.js?v=20260813-0713"></script>
  <script src="layer-kind-toggle.js?v=20260814-four-way-semantic"></script>

  <script>
    (() => {
      const root = document.documentElement;
      let lastChange = performance.now(), revealed = false;
      const observer = new MutationObserver(() => { lastChange = performance.now(); });
      observer.observe(document.body, { subtree:true, childList:true, attributes:true, characterData:true });
      function renderLooksComplete() {
        return !!(document.querySelector("#viz svg") && document.querySelector("#viz .cell") && document.querySelector("#breadcrumbs button") && document.querySelector("#depth-indicator") && document.body.dataset.theme && document.body.dataset.verbosity);
      }
      function reveal() {
        if (revealed) return;
        revealed = true;
        observer.disconnect();
        requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("atlas-booting")));
      }
      async function revealAfterFonts() { try { if (document.fonts?.ready) await document.fonts.ready; } catch (_) {} reveal(); }
      function poll() {
        if (renderLooksComplete() && performance.now() - lastChange >= 140) { revealAfterFonts(); return; }
        requestAnimationFrame(poll);
      }
      requestAnimationFrame(poll);
      setTimeout(revealAfterFonts, 3000);
    })();
  </script>
  <script src="card-stack-controls-v2.js?v=20260814-source-card-stack-after-boot"></script>
</body>
</html>
