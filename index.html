<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic Zooming with Hierarchical Aggregation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="title-block">
      <h1>Atlas hierarchy prototype</h1>
      <p>Weighted tiled clusters · click to expand · wheel/swipe to travel the vertical path</p>
    </div>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumb"></nav>
    <button id="reset" class="reset-button" type="button">All roots</button>
  </header>

  <main id="viz" aria-label="Interactive weighted hierarchy visualization"></main>

  <div class="key" aria-label="Visual encoding key">
    <span><i class="key-cell selected"></i> selected</span>
    <span><i class="key-cell faded"></i> sibling context</span>
    <span><i class="key-area"></i> area = aggregate importance</span>
    <span>↕ wheel / swipe = travel path</span>
  </div>

  <div id="status" class="status" aria-live="polite"></div>

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script src="app.js"></script>
  <script>
    const mediaNode = nodeById.get("media");
    if (mediaNode && !nodeById.has("digital-platforms")) {
      const deepLevels = [
        ["digital-platforms", "Digital Platforms", 610, 4.5, [["search-platforms", "Search Platforms"], ["video-platforms", "Video Platforms"]]],
        ["social-networks", "Social Networks", 570, 4.4, [["private-messaging", "Private Messaging"], ["online-communities", "Online Communities"]]],
        ["recommendation-systems", "Recommendation Systems", 530, 4.6, [["content-moderation", "Content Moderation"], ["feed-controls", "Feed Controls"]]],
        ["ranking-signals", "Ranking Signals", 500, 4.5, [["relevance-signals", "Relevance Signals"], ["freshness-signals", "Freshness Signals"]]],
        ["engagement-optimization", "Engagement Optimization", 470, 4.3, [["session-length", "Session Length"], ["return-frequency", "Return Frequency"]]],
        ["content-incentives", "Content Incentives", 445, 4.4, [["monetization", "Monetization"], ["virality-pressure", "Virality Pressure"]]],
        ["creator-behavior", "Creator Behavior", 420, 4.2, [["creator-economics", "Creator Economics"], ["publishing-frequency", "Publishing Frequency"]]],
        ["attention-dynamics", "Attention Dynamics", 395, 4.5, [["attention-fragmentation", "Attention Fragmentation"], ["notification-pressure", "Notification Pressure"]]],
        ["information-exposure", "Information Exposure", 370, 4.5, [["source-diversity", "Source Diversity"], ["repeat-exposure", "Repeat Exposure"]]],
        ["belief-formation", "Belief Formation", 345, 4.4, [["trust-signals", "Trust Signals"], ["social-proof", "Social Proof"]]],
        ["community-norms", "Community Norms", 320, 4.3, [["peer-effects", "Peer Effects"], ["group-identity", "Group Identity"]]],
        ["civic-response", "Civic Response", 295, 4.5, [["local-organizing", "Local Organizing"], ["public-comment", "Public Comment"]]],
        ["institutional-response", "Institutional Response", 270, 4.2, [["public-consultation", "Public Consultation"], ["agency-coordination", "Agency Coordination"]]],
        ["policy-feedback", "Policy Feedback", 245, 4.4, [["implementation", "Implementation"], ["evaluation", "Evaluation"], ["revision", "Revision"]]]
      ];

      let child = null;
      for (let i = deepLevels.length - 1; i >= 0; i -= 1) {
        const [id, name, votes, rating, siblingSpecs] = deepLevels[i];
        const siblings = siblingSpecs.map(([siblingId, siblingName], siblingIndex) => ({
          id: siblingId,
          name: siblingName,
          votes: Math.max(120, votes - 120 - siblingIndex * 35),
          rating: Math.max(3.8, rating - 0.2 + siblingIndex * 0.1)
        }));
        child = {
          id,
          name,
          votes,
          rating,
          children: child ? [child, ...siblings] : siblings
        };
      }

      mediaNode.children = [...(mediaNode.children || []), child];
      annotate(mediaNode, parentById.get(mediaNode.id), rootById.get(mediaNode.id));
    }

    const extraRoots = [
      ["housing", "Housing", "#b87972", 5200, 4.5, ["Supply", "Affordability", "Stability"]],
      ["food-systems", "Food Systems", "#a7a45a", 3300, 4.2, ["Food Access", "Agriculture", "Food Waste"]],
      ["justice", "Justice", "#9d7f91", 4100, 4.3, ["Courts", "Legal Access", "Corrections"]],
      ["public-safety", "Public Safety", "#7f8ca8", 3700, 4.1, ["Emergency Response", "Prevention", "Community Safety"]],
      ["science", "Science", "#6f9da0", 3000, 4.5, ["Research", "Science Literacy", "Research Funding"]],
      ["culture", "Culture", "#b488a8", 2600, 4.2, ["Arts", "Heritage", "Civic Life"]]
    ];

    extraRoots.forEach(([id, name, color, votes, rating, childNames]) => {
      if (nodeById.has(id)) return;
      const root = {
        id,
        name,
        color,
        votes,
        rating,
        children: childNames.map((childName, index) => ({
          id: `${id}-${childName.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`,
          name: childName,
          votes: Math.round(votes * (0.32 - index * 0.045)),
          rating: Math.max(3.9, rating - 0.1 + index * 0.05)
        }))
      };
      forestData.push(root);
      annotate(root);
    });

    // Every Atlas content item is explicitly either an issue or a solution.
    // The IDs remain stable, so semantic relabeling and recoloring do not change
    // the Voronoi seed or spatial positions.
    const solutionIds = new Set([
      "adaptation", "resilience", "policy", "public-awareness", "finance",
      "border-policy", "refugee-support", "legal-pathways", "integration",
      "coastal", "water", "outreach", "media", "community", "behavior",
      "citizen-science", "traditional-media", "storytelling", "misinformation",
      "prevention", "jobs", "trade", "conservation", "institutions", "elections",
      "transparency", "rights", "opportunity", "inclusion",
      "content-moderation", "feed-controls", "source-diversity", "trust-signals",
      "civic-response", "local-organizing", "public-comment", "institutional-response",
      "public-consultation", "agency-coordination", "policy-feedback", "implementation",
      "evaluation", "revision", "housing-supply", "housing-stability", "food-systems-food-access",
      "food-systems-agriculture", "justice-legal-access", "public-safety-emergency-response",
      "public-safety-prevention", "public-safety-community-safety", "science-research",
      "science-science-literacy", "science-research-funding", "culture-arts",
      "culture-heritage", "culture-civic-life"
    ]);

    const semanticNames = new Map([
      ["infrastructure", "Infrastructure Gaps"],
      ["education", "Education Access"],
      ["healthcare", "Healthcare Access"],
      ["economy", "Economic Instability"],
      ["environment", "Environmental Degradation"],
      ["governance", "Governance Challenges"],
      ["social-equity", "Social Inequity"],
      ["technology", "Technology Risks"],
      ["energy", "Energy Transition Challenges"],
      ["housing", "Housing Affordability"],
      ["food-systems", "Food Insecurity"],
      ["justice", "Justice Access"],
      ["public-safety", "Public Safety Risks"],
      ["science", "Science Trust"],
      ["culture", "Cultural Access"],
      ["transport", "Transportation Gaps"],
      ["utilities", "Utility Reliability"],
      ["housing-infra", "Housing Infrastructure Shortage"],
      ["biodiversity", "Biodiversity Loss"],
      ["social-media", "Social Media Harms"],
      ["digital-platforms", "Digital Platform Effects"]
    ]);

    function applySemanticType(node) {
      node.kind = solutionIds.has(node.id) ? "solution" : "issue";
      if (semanticNames.has(node.id)) node.name = semanticNames.get(node.id);
      (node.children || []).forEach(applySemanticType);
    }
    forestData.forEach(applySemanticType);

    const ISSUE_COLOR = "#71879a";
    const SOLUTION_COLOR = "#5f9864";
    rootColor = function(node) {
      return node.kind === "solution" ? SOLUTION_COLOR : ISSUE_COLOR;
    };

    const visualKey = document.querySelector(".key");
    if (visualKey && !visualKey.querySelector(".issue-kind-key")) {
      const issueKey = document.createElement("span");
      issueKey.className = "issue-kind-key";
      issueKey.innerHTML = `<i class="key-cell" style="background:${ISSUE_COLOR}"></i> issue`;
      const solutionKey = document.createElement("span");
      solutionKey.className = "solution-kind-key";
      solutionKey.innerHTML = `<i class="key-cell" style="background:${SOLUTION_COLOR}"></i> solution`;
      visualKey.prepend(solutionKey);
      visualKey.prepend(issueKey);
    }

    // Stable Voronoi geometry: selection changes visual emphasis only.
    layoutCluster = function(items, w, h) {
      const proxies = items.map(item => ({
        id: item.id,
        item,
        weight: Math.max(1, aggregateScore(item))
      }));
      const root = d3.hierarchy({ children: proxies }).sum(d => d.weight || 0);
      const polygon = outerPolygon(w, h);
      const stableKey = items.map(item => item.id).join("-");
      const seed = Array.from(stableKey).reduce(
        (a, c) => ((a * 31 + c.charCodeAt(0)) >>> 0),
        2166136261
      ) / 4294967296;
      d3.voronoiTreemap()
        .clip(polygon)
        .prng(d3.randomLcg(seed || 0.42))(root);
      return { root, polygon };
    };

    // Preserve full breadcrumb labels and auto-scroll only the breadcrumb strip
    // to its newest/rightmost item after each rebuild.
    const baseRenderBreadcrumbs = renderBreadcrumbs;
    renderBreadcrumbs = function() {
      baseRenderBreadcrumbs();
      requestAnimationFrame(() => {
        breadcrumbHost.scrollLeft = Math.max(0, breadcrumbHost.scrollWidth - breadcrumbHost.clientWidth);
      });
    };

    // Clicking a node moves the camera to its child section.
    focusNode = function(id) {
      const node = nodeById.get(id);
      if (!node) return;

      if (window.stopHierarchyMomentum) window.stopHierarchyMomentum();
      focusPath = pathForNode(id);
      render();

      const targetDepth = node.children?.length
        ? focusPath.length
        : focusPath.length - 1;

      requestAnimationFrame(() => scrollToDepth(targetDepth, true));

      statusHost.textContent = node.children?.length
        ? `${node.name} selected. Scrolled to its ${node.children.length} child issues. Scroll upward to revisit ancestors.`
        : `${node.name} selected. This is a leaf node in the prototype. Scroll upward to revisit ancestors.`;
    };

    // Momentum-based camera scrolling.
    (() => {
      let momentumFrame = 0;
      let velocity = 0;
      let lastTouchY = null;
      let lastTouchTime = 0;
      let touchOriginY = null;
      let wheelTimer = 0;
      const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function stopMomentum() {
        if (momentumFrame) cancelAnimationFrame(momentumFrame);
        momentumFrame = 0;
        velocity = 0;
        clearTimeout(wheelTimer);
      }
      window.stopHierarchyMomentum = stopMomentum;

      function startMomentum() {
        if (reducedMotion() || Math.abs(velocity) < 0.35 || momentumFrame) return;
        const tick = () => {
          const before = cameraY;
          cameraY += velocity;
          applyCamera(false);
          const hitBoundary = Math.abs(cameraY - before) < 0.01 && Math.abs(velocity) > 0.35;
          velocity *= 0.92;

          if (hitBoundary || Math.abs(velocity) < 0.35) {
            momentumFrame = 0;
            velocity = 0;
            return;
          }
          momentumFrame = requestAnimationFrame(tick);
        };
        momentumFrame = requestAnimationFrame(tick);
      }

      host.addEventListener("wheel", event => {
        if (!focusPath.length || worldHeight <= height) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        if (momentumFrame) cancelAnimationFrame(momentumFrame);
        momentumFrame = 0;

        const movement = -event.deltaY * 0.78;
        cameraY += movement;
        applyCamera(false);
        velocity = Math.max(-42, Math.min(42, movement * 0.72));

        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(startMomentum, 52);
      }, { passive: false, capture: true });

      host.addEventListener("touchstart", event => {
        if (!focusPath.length || event.touches.length !== 1) return;
        event.stopImmediatePropagation();
        stopMomentum();
        const touch = event.touches[0];
        lastTouchY = touch.clientY;
        touchOriginY = touch.clientY;
        lastTouchTime = performance.now();
        touchMoved = false;
      }, { passive: true, capture: true });

      host.addEventListener("touchmove", event => {
        if (lastTouchY == null || event.touches.length !== 1 || !focusPath.length) return;
        event.preventDefault();
        event.stopImmediatePropagation();

        const now = performance.now();
        const y = event.touches[0].clientY;
        const dy = y - lastTouchY;
        const dt = Math.max(8, now - lastTouchTime);
        if (Math.abs(y - touchOriginY) > 6) touchMoved = true;

        cameraY += dy;
        applyCamera(false);

        const instantaneous = dy * (16.667 / dt);
        velocity = velocity * 0.55 + instantaneous * 0.45;
        velocity = Math.max(-48, Math.min(48, velocity));
        lastTouchY = y;
        lastTouchTime = now;
      }, { passive: false, capture: true });

      host.addEventListener("touchend", event => {
        if (lastTouchY == null) return;
        event.stopImmediatePropagation();
        lastTouchY = null;
        lastTouchTime = 0;
        touchOriginY = null;
        startMomentum();
        setTimeout(() => { touchMoved = false; }, 80);
      }, { passive: true, capture: true });

      host.addEventListener("touchcancel", () => {
        lastTouchY = null;
        lastTouchTime = 0;
        touchOriginY = null;
        stopMomentum();
        touchMoved = false;
      }, { passive: true, capture: true });
    })();

    render();
  </script>
</body>
</html>
