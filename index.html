<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic Zooming with Hierarchical Aggregation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="title-block">
      <h1>Atlas hierarchy prototype</h1>
      <p>Weighted tiled clusters · click to focus · hierarchy stays vertical</p>
    </div>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Hierarchy breadcrumb"></nav>
    <button id="reset" class="reset-button" type="button">All roots</button>
  </header>

  <main id="viz" aria-label="Interactive weighted hierarchy visualization"></main>

  <div class="key" aria-label="Visual encoding key">
    <span><i class="key-cell selected"></i> selected</span>
    <span><i class="key-cell faded"></i> sibling context</span>
    <span><i class="key-area"></i> area = aggregate importance</span>
  </div>

  <div id="status" class="status" aria-live="polite"></div>

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
