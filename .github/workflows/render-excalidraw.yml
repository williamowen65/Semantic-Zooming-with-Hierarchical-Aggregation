name: Render Excalidraw previews

on:
  push:
    branches: [main]
    paths:
      - 'planning/**/*.excalidraw'
      - '.github/workflows/render-excalidraw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Excalidraw exporter and PNG converter
        run: |
          npm install --global excalidraw_export@1.1.0
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render PNG previews
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            if ! node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(Array.isArray(f.elements) && f.elements.length > 0 ? 0 : 1)" "$file"; then
              echo "Skipping empty scene: $file"
              rm -f "${file%.excalidraw}.svg" "${file%.excalidraw}.png" "${file}.svg"
              continue
            fi

            echo "Rendering $file"
            excalidraw_export "$file"
            svg="${file%.excalidraw}.svg"
            png="${file%.excalidraw}.png"
            mv -f "${file}.svg" "$svg"
            rsvg-convert -o "$png" "$svg"
          done < <(find planning -type f -name '*.excalidraw' -print0)

      - name: Commit updated previews
        shell: bash
        run: |
          git add -A -- 'planning/**/*.svg' 'planning/**/*.png'

          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: render Excalidraw previews'
          git push
