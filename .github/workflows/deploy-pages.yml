name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build latest and commit-specific site
        shell: bash
        run: |
          mkdir -p "_site/${GITHUB_SHA}"

          assets=(
            index.html
            styles.css
            theme-toolbar-fix.css
            layer-context.css
            leaf-end-state.css
            app.js
            node-labels-no-icons.js
            personal-scope-data.js
            environment-expansion.js
            descriptions.js
            enhancements.js
            camera-spacing-fix.js
            semantic-icons.js
            hierarchy-links.js
            theme-picker.js
            layer-context.js
            scroll-to-card.js
            leaf-end-state.js
            hierarchy-overview.js
            overview-gap-spacing.js
            url-state.js
            dense-layer-test.js
            layer-kind-toggle.js
          )

          cp "${assets[@]}" _site/
          cp "${assets[@]}" "_site/${GITHUB_SHA}/"

          # The former hierarchy-overview asset now controls layer height only.
          # Give it a commit-specific query string so mobile browsers cannot keep
          # serving the old hierarchy-wide zoom implementation from cache.
          for page in "_site/index.html" "_site/${GITHUB_SHA}/index.html"; do
            sed -E -i "s#hierarchy-overview\.js\?v=[^\"]+#hierarchy-overview.js?v=${GITHUB_SHA}#g" "$page"
          done

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4