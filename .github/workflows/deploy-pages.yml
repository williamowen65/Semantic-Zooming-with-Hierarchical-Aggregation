name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build latest and commit-specific site
        shell: bash
        run: |
          mkdir -p "_site/${GITHUB_SHA}"

          # Keep this list aligned with every local asset referenced by index.html.
          # Missing files here work locally but 404 on GitHub Pages.
          assets=(
            index.html
            styles.css
            theme-toolbar-fix.css
            layer-context.css
            leaf-end-state.css
            app.js
            environment-expansion.js
            descriptions.js
            enhancements.js
            camera-spacing-fix.js
            semantic-icons.js
            hierarchy-links.js
            theme-picker.js
            layer-context.js
            leaf-end-state.js
          )

          cp "${assets[@]}" _site/
          cp "${assets[@]}" "_site/${GITHUB_SHA}/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4