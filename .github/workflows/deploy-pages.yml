name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build latest and commit-specific site
        shell: bash
        run: |
          mkdir -p "_site/${GITHUB_SHA}"

          assets=(
            index.html
            styles.css
            theme-toolbar-fix.css
            layer-context.css
            leaf-end-state.css
            app.js
            node-labels-no-icons.js
            personal-scope-data.js
            environment-expansion.js
            descriptions.js
            enhancements.js
            camera-spacing-fix.js
            semantic-icons.js
            hierarchy-links.js
            theme-picker.js
            layer-context.js
            scroll-to-card.js
            leaf-end-state.js
            hierarchy-overview.js
            overview-gap-spacing.js
            url-state.js
            dense-layer-test.js
            layer-kind-toggle.js
            layer-kind-state.js
            layer-kind-filter.js
            layer-kind-api.js
            layer-kind-actions.js
            root-layer-label.js
            layer-kind-clicks.js
            card-stack-layer-kind-bridge.js
            card-stack-controls-v2.js
          )

          cp "${assets[@]}" _site/
          cp "${assets[@]}" "_site/${GITHUB_SHA}/"

          for page in "_site/index.html" "_site/${GITHUB_SHA}/index.html"; do
            sed -E -i "s#hierarchy-overview\.js\?v=[^\"]+#hierarchy-overview.js?v=${GITHUB_SHA}#g" "$page"
            sed -E -i "s#layer-kind-toggle\.js\?v=[^\"]+#layer-kind-toggle.js?v=${GITHUB_SHA}#g" "$page"
            sed -E -i "s#leaf-end-state\.css\?v=[^\"]+#leaf-end-state.css?v=${GITHUB_SHA}#g" "$page"
            sed -E -i "s#leaf-end-state\.js\?v=[^\"]+#leaf-end-state.js?v=${GITHUB_SHA}#g" "$page"

            if ! grep -q 'card-stack-layer-kind-bridge.js' "$page"; then
              sed -i "s#</body>#  <script src=\"card-stack-layer-kind-bridge.js?v=${GITHUB_SHA}\"></script>\n</body>#" "$page"
            else
              sed -E -i "s#card-stack-layer-kind-bridge\.js\?v=[^\"]+#card-stack-layer-kind-bridge.js?v=${GITHUB_SHA}#g" "$page"
            fi
            sed -i '/card-stack-controls\.js/d' "$page"
            if ! grep -q 'card-stack-controls-v2.js' "$page"; then
              sed -i "s#</body>#  <script src=\"card-stack-controls-v2.js?v=${GITHUB_SHA}\"></script>\n</body>#" "$page"
            else
              sed -E -i "s#card-stack-controls-v2\.js\?v=[^\"]+#card-stack-controls-v2.js?v=${GITHUB_SHA}#g" "$page"
            fi
          done

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
